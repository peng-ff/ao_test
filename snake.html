<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f23;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        h1 {
            font-size: 28px;
            color: #4ade80;
            letter-spacing: 4px;
        }
        .score-board {
            display: flex;
            gap: 40px;
            font-size: 16px;
        }
        .score-board span { color: #9ca3af; }
        .score-board strong { color: #facc15; }
        canvas {
            border: 2px solid #2d2d4a;
            border-radius: 4px;
            display: block;
            max-width: 100%;
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 10px 28px;
            font-size: 16px;
            background: #4ade80;
            color: #0f0f23;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #22c55e; }
        .hint {
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>贪吃蛇</h1>
        <div class="score-board">
            <div><span>得分: </span><strong id="score">0</strong></div>
            <div><span>最高分: </span><strong id="highScore">0</strong></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="actionBtn">开始游戏</button>
            <p class="hint">方向键 / WASD 控制方向，空格键 开始/重玩</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const actionBtn = document.getElementById('actionBtn');

        const CELL_SIZE = 20;
        const GRID_SIZE = 20;
        const TICK_MS = 150;

        let gameState = 'IDLE';
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let intervalId = null;

        highScoreEl.textContent = highScore;

        function resetGame() {
            snake = [
                { x: 11, y: 10 },
                { x: 10, y: 10 },
                { x: 9, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            spawnFood();
        }

        function spawnFood() {
            let fx, fy;
            do {
                fx = Math.floor(Math.random() * GRID_SIZE);
                fy = Math.floor(Math.random() * GRID_SIZE);
            } while (snake.some(s => s.x === fx && s.y === fy));
            food = { x: fx, y: fy };
        }

        function update() {
            direction = { ...nextDirection };

            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
                newHead.y < 0 || newHead.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                gameOver();
                return;
            }

            snake.unshift(newHead);

            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            clearInterval(intervalId);
            intervalId = null;
            if (score > highScore) {
                highScore = score;
                highScoreEl.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }
            actionBtn.textContent = '重新开始';
            actionBtn.style.display = '';
            render();
        }

        function render() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 1; i < GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(canvas.width, i * CELL_SIZE);
                ctx.stroke();
            }

            // food
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 - 2, 0, Math.PI * 2
            );
            ctx.fill();
            ctx.fillStyle = 'rgba(239,68,68,0.3)';
            ctx.beginPath();
            ctx.arc(
                food.x * CELL_SIZE + CELL_SIZE / 2,
                food.y * CELL_SIZE + CELL_SIZE / 2,
                CELL_SIZE / 2 + 1, 0, Math.PI * 2
            );
            ctx.fill();

            // snake
            snake.forEach((seg, i) => {
                const x = seg.x * CELL_SIZE + 1;
                const y = seg.y * CELL_SIZE + 1;
                const size = CELL_SIZE - 2;
                const r = 4;
                ctx.fillStyle = i === 0 ? '#4ade80' : '#16a34a';
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + size - r, y);
                ctx.quadraticCurveTo(x + size, y, x + size, y + r);
                ctx.lineTo(x + size, y + size - r);
                ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
                ctx.lineTo(x + r, y + size);
                ctx.quadraticCurveTo(x, y + size, x, y + size - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
                ctx.fill();
            });

            // overlay for IDLE / GAMEOVER
            if (gameState === 'IDLE') {
                drawOverlay('贪吃蛇', '按空格键或点击按钮开始');
            } else if (gameState === 'GAMEOVER') {
                drawOverlay('游戏结束', '得分: ' + score);
            }
        }

        function drawOverlay(title, subtitle) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4ade80';
            ctx.font = 'bold 32px "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#9ca3af';
            ctx.font = '16px "Microsoft YaHei", sans-serif';
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 24);
        }

        function startGame() {
            resetGame();
            gameState = 'PLAYING';
            actionBtn.style.display = 'none';
            render();
            intervalId = setInterval(function () {
                update();
                if (gameState === 'PLAYING') render();
            }, TICK_MS);
        }

        document.addEventListener('keydown', function (e) {
            const key = e.key;
            if (key === ' ' || key === 'Spacebar') {
                e.preventDefault();
                if (gameState !== 'PLAYING') startGame();
                return;
            }
            if (gameState !== 'PLAYING') return;

            let nd = null;
            if (key === 'ArrowUp' || key === 'w' || key === 'W') nd = { x: 0, y: -1 };
            else if (key === 'ArrowDown' || key === 's' || key === 'S') nd = { x: 0, y: 1 };
            else if (key === 'ArrowLeft' || key === 'a' || key === 'A') nd = { x: -1, y: 0 };
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') nd = { x: 1, y: 0 };

            if (nd && !(nd.x + direction.x === 0 && nd.y + direction.y === 0)) {
                e.preventDefault();
                nextDirection = nd;
            }
        });

        actionBtn.addEventListener('click', function () {
            if (gameState !== 'PLAYING') startGame();
        });

        // initial render
        resetGame();
        render();
    </script>
</body>
</html>
