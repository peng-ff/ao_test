server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: crazy-snake-game

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crazy_snake_game?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# JWT配置
jwt:
  secret: crazySnakeGameSecretKey2024ForJWTTokenGenerationAndValidation
  expiration: 86400000  # 24小时，单位毫秒

# 日志配置
logging:
  level:
    com.snake.game: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
